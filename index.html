<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#b72b36" />
    <title>Dükkan — İşletme Paneli</title>
    <meta name="description" content="Satış, stok ve tahminlerinizi tek bir sade panelden takip edin." />
    <style>
      :root {
        --red: #b72b36;
        --dark: #29282b;
        --muted: #858387;
        --line: #eceaeb;
        --bg: #f7f7f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--dark);
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      [role="button"]:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #df9b9e;
        outline-offset: 3px;
      }
      button {
        border: 1px solid var(--line);
        background: white;
        color: var(--dark);
        padding: 11px 16px;
        border-radius: 8px;
      }
      button:hover {
        background: #f8eeee;
      }
      .primary {
        background: var(--red);
        color: white;
        border-color: var(--red);
      }
      .primary:hover {
        background: #97222b;
      }
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        width: 224px;
        background: white;
        border-right: 1px solid var(--line);
        padding: 32px 20px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        font-size: 29px;
        font-weight: 750;
        letter-spacing: -1.5px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        background: var(--red);
        color: white;
        border-radius: 9px;
        width: 34px;
        height: 35px;
        font-size: 23px;
        text-align: center;
        line-height: 35px;
        letter-spacing: 0;
      }
      .subbrand {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--muted);
        margin: 8px 0 38px 45px;
      }
      nav {
        display: grid;
        gap: 8px;
      }
      nav button {
        text-align: left;
        border: 0;
        color: #767279;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 14px;
      }
      .active {
        background: #faeeee !important;
        color: var(--red) !important;
        font-weight: 650;
      }
      svg.ico {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sidebottom {
        margin-top: auto;
      }
      .shop {
        border-top: 1px solid var(--line);
        margin-top: 18px;
        padding-top: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .avatar {
        border-radius: 9px;
        background: #f1eeee;
        padding: 11px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .shop strong {
        display: block;
        font-size: 13px;
        margin-bottom: 5px;
      }
      main {
        margin-left: 224px;
        padding: 0 42px 34px;
        max-width: 1600px;
      }
      header {
        height: 87px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 34px;
      }
      .crumb {
        font-size: 12px;
        color: #888;
      }
      .headerActions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .demo {
        background: #f2ebdf;
        color: #8b6c39;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 11px;
      }
      .bell {
        position: relative;
      }
      .dot {
        position: absolute;
        right: 13px;
        top: 9px;
        width: 6px;
        height: 6px;
        background: var(--red);
        border-radius: 50%;
      }
      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 26px;
        gap: 14px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.8px;
        margin: 0 0 9px;
        font-weight: 650;
      }
      p {
        line-height: 1.65;
        margin: 6px 0;
      }
      .subtitle {
        color: #858087;
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 9px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 17px;
        margin-bottom: 23px;
      }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 11px;
      }
      .stat {
        padding: 22px;
      }
      .stat[role="button"]:hover {
        border-color: #d9a7ad;
        box-shadow: 0 3px 12px #b72b3609;
      }
      .stathead {
        display: flex;
        justify-content: space-between;
        color: #777279;
        font-size: 12px;
      }
      .stathead svg {
        color: #aaa;
      }
      .value {
        font-size: 29px;
        font-weight: 650;
        letter-spacing: -0.8px;
        margin: 19px 0 10px;
      }
      .trend {
        font-size: 11px;
        color: #41836c;
      }
      .trend span {
        color: #959095;
        margin-left: 5px;
      }
      .danger {
        color: var(--red);
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(275px, 1fr);
        gap: 23px;
      }
      .panel {
        padding: 24px;
      }
      .paneltop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 19px;
      }
      h2 {
        font-size: 15px;
        margin: 0;
        font-weight: 650;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      .smallbtn {
        padding: 7px 10px;
        font-size: 11px;
      }
      .chart {
        width: 100%;
        height: 220px;
      }
      .legend {
        display: flex;
        gap: 17px;
        font-size: 11px;
        color: #888;
        margin-top: 7px;
      }
      .legend i {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: var(--red);
        border-radius: 50%;
        margin-right: 6px;
      }
      .legend i.gray {
        background: #cdc6c8;
      }
      .insight {
        border-top: 1px solid var(--line);
        margin-top: 15px;
        padding-top: 16px;
        font-size: 12px;
        color: #7c777b;
      }
      .assistant {
        background: #fff;
        border-top: 3px solid var(--red);
      }
      .agentBadge {
        background: #f8ecee;
        color: var(--red);
        border-radius: 5px;
        padding: 6px 8px;
        font-size: 10px;
      }
      .agentitem {
        border-bottom: 1px solid var(--line);
        padding: 17px 0;
        display: flex;
        gap: 12px;
      }
      .agentitem:last-of-type {
        border-bottom: 0;
      }
      .badgeicon {
        background: #faeeee;
        color: var(--red);
        border-radius: 8px;
        min-width: 31px;
        height: 31px;
        display: grid;
        place-items: center;
      }
      .agentitem p {
        font-size: 12px;
        color: #7e787d;
        line-height: 1.6;
      }
      .time {
        font-size: 10px;
        color: #aaa;
      }
      .bottom {
        margin-top: 23px;
      }
      .link {
        color: var(--red);
        border: 0;
        background: none;
        padding: 0;
        font-size: 12px;
      }
      .tablewrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        white-space: nowrap;
      }
      th {
        text-align: left;
        font-weight: 500;
        font-size: 11px;
        color: #969097;
        padding: 12px 10px;
        background: #fafafa;
      }
      td {
        padding: 15px 10px;
        border-bottom: 1px solid #f1eff0;
        font-size: 12px;
      }
      td:first-child {
        font-weight: 550;
      }
      .pill {
        display: inline-block;
        border-radius: 5px;
        padding: 5px 9px;
        font-size: 10px;
        background: #f7e9eb;
        color: var(--red);
      }
      .pill.ok {
        background: #eef4f0;
        color: #527969;
      }
      .productIcon {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: #f7f5f3;
        margin-right: 10px;
        border-radius: 6px;
        font-size: 15px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
        font-size: 10px;
        color: #a29ca1;
      }
      .note {
        padding: 14px 18px;
        background: #f7f2ec;
        color: #8a7353;
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 20px;
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 15px 0;
        font-size: 12px;
      }
      input,
      select {
        padding: 12px;
        border: 1px solid #dedbdd;
        border-radius: 7px;
        background: white;
        min-width: 0;
      }
      .rules {
        display: grid;
        gap: 15px;
      }
      .rule {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 9px;
        gap: 15px;
      }
      .rule p {
        font-size: 12px;
        color: #888;
      }
      .rule input {
        accent-color: var(--red);
        width: 18px;
        height: 18px;
      }
      .twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .hidden {
        display: none !important;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 26px;
        width: min(480px, 94vw);
        color: var(--dark);
      }
      dialog::backdrop {
        background: #24202977;
        backdrop-filter: blur(3px);
      }
      .dialoghead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: #29282b;
        color: white;
        padding: 14px 24px;
        border-radius: 10px;
        z-index: 20;
        font-size: 13px;
      }
      .phoneModal {
        width: 440px;
        max-width: 98vw;
        background: #f2f1f2;
        padding: 18px;
      }
      .phoneModal iframe {
        display: block;
        width: 100%;
        height: 70vh;
        border: 7px solid #29282b;
        border-radius: 28px;
        background: white;
      }
      .forecastbars {
        display: flex;
        align-items: end;
        gap: 12px;
        height: 220px;
        padding-top: 20px;
      }
      .fbar {
        flex: 1;
        background: #b72b36bb;
        border-radius: 5px 5px 0 0;
        position: relative;
      }
      .fbar span {
        position: absolute;
        bottom: -24px;
        font-size: 11px;
        left: 50%;
        transform: translateX(-50%);
      }
      .fbar b {
        position: absolute;
        top: -22px;
        width: 100%;
        text-align: center;
        font-size: 11px;
      }
      .importzone {
        padding: 40px;
        text-align: center;
        border: 1px dashed #cbbbc0;
        border-radius: 10px;
        background: #fcfafb;
        margin: 18px 0;
      }
      .empty {
        padding: 35px;
        text-align: center;
        color: #888;
      }
      @media (min-width: 1600px) {
        main {
          margin-right: auto;
        }
      }
      @media (max-width: 1100px) {
        main {
          padding: 0 24px 24px;
        }
        .stats {
          gap: 10px;
        }
        .stat {
          padding: 17px;
        }
        .value {
          font-size: 24px;
        }
        .grid {
          grid-template-columns: 1.5fr 1fr;
        }
        aside {
          width: 190px;
          padding: 28px 15px;
        }
        main {
          margin-left: 190px;
        }
      }
      @media (max-width: 760px) {
        aside {
          position: fixed;
          inset: auto 0 0;
          width: auto;
          height: 70px;
          padding: 7px 8px;
          z-index: 5;
          border-top: 1px solid var(--line);
        }
        aside .brand,
        aside .subbrand,
        .sidebottom {
          display: none;
        }
        nav {
          display: flex;
          justify-content: space-around;
          gap: 0;
        }
        nav button {
          display: flex;
          flex-direction: column;
          gap: 5px;
          font-size: 10px;
          padding: 6px 10px;
        }
        nav button svg {
          width: 20px;
          height: 20px;
        }
        main {
          margin: 0;
          padding: 0 18px 90px;
        }
        header {
          height: 68px;
          margin-bottom: 23px;
        }
        .headerActions {
          gap: 7px;
        }
        .headerActions .avatar {
          display: none;
        }
        .crumb {
          font-size: 11px;
        }
        .titlebar {
          align-items: flex-start;
          flex-direction: column;
          gap: 16px;
        }
        h1 {
          font-size: 25px;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
          gap: 11px;
        }
        .stat {
          padding: 16px;
        }
        .value {
          margin: 15px 0 8px;
          font-size: 25px;
        }
        .trend span {
          display: block;
          margin: 4px 0 0;
        }
        .grid,
        .twocol {
          grid-template-columns: 1fr;
          gap: 17px;
        }
        .panel {
          padding: 18px;
        }
        .chart {
          height: 190px;
        }
        .phoneButton {
          font-size: 0;
          padding: 8px;
        }
        .phoneButton svg {
          width: 18px;
        }
        .headerActions button {
          padding: 8px;
        }
        footer {
          line-height: 1.6;
          gap: 20px;
        }
        .phoneModal iframe {
          height: 70vh;
        }
        .rule {
          padding: 13px;
        }
        .actions button {
          font-size: 12px;
        }
      }
    </style>
    <link rel="stylesheet" href="polish.css" />
    <link rel="icon" type="image/svg+xml" href="assets/m-logo.svg" />
    <link rel="apple-touch-icon" href="assets/m-logo.svg" />
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <img class="brandMark" src="assets/m-logo.svg" alt="M mağaza logosu" width="64" height="68" /><span
          class="brandWord"
          >dükkan<span style="color: var(--red)">.</span></span
        >
      </div>
      <div class="subbrand">İŞİNİZİN YANINDA</div>
      <nav id="nav"></nav>
      <div class="sidebottom">
        <div class="note" style="font-size: 11px; margin: 0">
          Daha az karmaşa.<br />Daha bilinçli kararlar.
        </div>
        <div class="shop">
          <span class="avatar">YM</span>
          <div><strong>Yılmaz Market</strong><span class="muted">İşletme paneli</span></div>
        </div>
      </div>
    </aside>
    <main>
      <header>
        <div class="headerIdentity">
          <img class="mobileMark" src="assets/m-logo.svg" alt="M mağaza logosu" width="36" height="39" />
          <div class="crumb">
            İşletmem <span style="margin: 0 10px; color: #ccc">/</span> <span id="crumb">Genel bakış</span>
          </div>
        </div>
        <div class="headerActions">
          <span class="demo">Örnek veri</span
          ><button class="tabletButton" onclick="openTablet()" title="Tablet görünümü">Tablet görünümü</button
          ><button class="phoneButton" onclick="openPhone()" title="Telefon görünümü">
            ▯ <span>Telefon görünümü</span></button
          ><button class="bell" onclick="navigate('assistant')" aria-label="Bildirimleri aç">
            ♧<i class="dot"></i></button
          ><span class="avatar">EY</span>
        </div>
      </header>
      <div id="content"></div>
      <footer>
        <span>Dükkan · İşletmeniz için akıllı bir yardımcı</span
        ><span>2209-A araştırma projesi · Ön izleme</span>
      </footer>
    </main>
    <dialog id="modal">
      <div class="dialoghead">
        <h2 id="mtitle"></h2>
        <button onclick="this.closest('dialog').close()" aria-label="Kapat">×</button>
      </div>
      <div id="mbody"></div>
    </dialog>
    <dialog id="phone" class="phoneModal">
      <div class="dialoghead">
        <h2>Telefon görünümü</h2>
        <button onclick="document.getElementById('phone').close()">Kapat</button>
      </div>
      <iframe title="Uygulamanın telefon görünümü" id="phoneFrame"></iframe>
    </dialog>
    <div id="toast" class="toast hidden" role="status"></div>
    <script defer src="register-core.js"></script>
    <script defer src="app.js"></script>
    <script defer src="categories.js"></script>
    <script defer src="stock.js"></script>
    <script defer src="sales-report.js"></script>
    <script defer src="day-end.js"></script>
    <script defer src="register.js"></script>
    <script defer src="overview.js"></script>
    <script defer src="forecast.js"></script>
    <script defer src="assistant.js"></script>
    <script defer src="reports.js"></script>
    <script defer src="main.js"></script>
  </body>
</html>
