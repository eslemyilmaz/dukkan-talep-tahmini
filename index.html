<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dükkan — İşletme Paneli</title>
    <meta name="description" content="Satış, stok ve tahminlerinizi tek bir sade panelden takip edin." />
    <style>
      :root {
        --red: #b72b36;
        --dark: #29282b;
        --muted: #858387;
        --line: #eceaeb;
        --bg: #f7f7f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--dark);
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      [role="button"]:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #df9b9e;
        outline-offset: 3px;
      }
      button {
        border: 1px solid var(--line);
        background: white;
        color: var(--dark);
        padding: 11px 16px;
        border-radius: 8px;
      }
      button:hover {
        background: #f8eeee;
      }
      .primary {
        background: var(--red);
        color: white;
        border-color: var(--red);
      }
      .primary:hover {
        background: #97222b;
      }
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        width: 224px;
        background: white;
        border-right: 1px solid var(--line);
        padding: 32px 20px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        font-size: 29px;
        font-weight: 750;
        letter-spacing: -1.5px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        background: var(--red);
        color: white;
        border-radius: 9px;
        width: 34px;
        height: 35px;
        font-size: 23px;
        text-align: center;
        line-height: 35px;
        letter-spacing: 0;
      }
      .subbrand {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--muted);
        margin: 8px 0 38px 45px;
      }
      nav {
        display: grid;
        gap: 8px;
      }
      nav button {
        text-align: left;
        border: 0;
        color: #767279;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 14px;
      }
      .active {
        background: #faeeee !important;
        color: var(--red) !important;
        font-weight: 650;
      }
      svg.ico {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sidebottom {
        margin-top: auto;
      }
      .shop {
        border-top: 1px solid var(--line);
        margin-top: 18px;
        padding-top: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .avatar {
        border-radius: 9px;
        background: #f1eeee;
        padding: 11px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .shop strong {
        display: block;
        font-size: 13px;
        margin-bottom: 5px;
      }
      main {
        margin-left: 224px;
        padding: 0 42px 34px;
        max-width: 1600px;
      }
      header {
        height: 87px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 34px;
      }
      .crumb {
        font-size: 12px;
        color: #888;
      }
      .headerActions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .demo {
        background: #f2ebdf;
        color: #8b6c39;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 11px;
      }
      .bell {
        position: relative;
      }
      .dot {
        position: absolute;
        right: 13px;
        top: 9px;
        width: 6px;
        height: 6px;
        background: var(--red);
        border-radius: 50%;
      }
      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 26px;
        gap: 14px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.8px;
        margin: 0 0 9px;
        font-weight: 650;
      }
      p {
        line-height: 1.65;
        margin: 6px 0;
      }
      .subtitle {
        color: #858087;
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 9px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 17px;
        margin-bottom: 23px;
      }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 11px;
      }
      .stat {
        padding: 22px;
      }
      .stat[role="button"]:hover {
        border-color: #d9a7ad;
        box-shadow: 0 3px 12px #b72b3609;
      }
      .stathead {
        display: flex;
        justify-content: space-between;
        color: #777279;
        font-size: 12px;
      }
      .stathead svg {
        color: #aaa;
      }
      .value {
        font-size: 29px;
        font-weight: 650;
        letter-spacing: -0.8px;
        margin: 19px 0 10px;
      }
      .trend {
        font-size: 11px;
        color: #41836c;
      }
      .trend span {
        color: #959095;
        margin-left: 5px;
      }
      .danger {
        color: var(--red);
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(275px, 1fr);
        gap: 23px;
      }
      .panel {
        padding: 24px;
      }
      .paneltop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 19px;
      }
      h2 {
        font-size: 15px;
        margin: 0;
        font-weight: 650;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      .smallbtn {
        padding: 7px 10px;
        font-size: 11px;
      }
      .chart {
        width: 100%;
        height: 220px;
      }
      .legend {
        display: flex;
        gap: 17px;
        font-size: 11px;
        color: #888;
        margin-top: 7px;
      }
      .legend i {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: var(--red);
        border-radius: 50%;
        margin-right: 6px;
      }
      .legend i.gray {
        background: #cdc6c8;
      }
      .insight {
        border-top: 1px solid var(--line);
        margin-top: 15px;
        padding-top: 16px;
        font-size: 12px;
        color: #7c777b;
      }
      .assistant {
        background: #fff;
        border-top: 3px solid var(--red);
      }
      .agentBadge {
        background: #f8ecee;
        color: var(--red);
        border-radius: 5px;
        padding: 6px 8px;
        font-size: 10px;
      }
      .agentitem {
        border-bottom: 1px solid var(--line);
        padding: 17px 0;
        display: flex;
        gap: 12px;
      }
      .agentitem:last-of-type {
        border-bottom: 0;
      }
      .badgeicon {
        background: #faeeee;
        color: var(--red);
        border-radius: 8px;
        min-width: 31px;
        height: 31px;
        display: grid;
        place-items: center;
      }
      .agentitem p {
        font-size: 12px;
        color: #7e787d;
        line-height: 1.6;
      }
      .time {
        font-size: 10px;
        color: #aaa;
      }
      .bottom {
        margin-top: 23px;
      }
      .link {
        color: var(--red);
        border: 0;
        background: none;
        padding: 0;
        font-size: 12px;
      }
      .tablewrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        white-space: nowrap;
      }
      th {
        text-align: left;
        font-weight: 500;
        font-size: 11px;
        color: #969097;
        padding: 12px 10px;
        background: #fafafa;
      }
      td {
        padding: 15px 10px;
        border-bottom: 1px solid #f1eff0;
        font-size: 12px;
      }
      td:first-child {
        font-weight: 550;
      }
      .pill {
        display: inline-block;
        border-radius: 5px;
        padding: 5px 9px;
        font-size: 10px;
        background: #f7e9eb;
        color: var(--red);
      }
      .pill.ok {
        background: #eef4f0;
        color: #527969;
      }
      .productIcon {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: #f7f5f3;
        margin-right: 10px;
        border-radius: 6px;
        font-size: 15px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
        font-size: 10px;
        color: #a29ca1;
      }
      .note {
        padding: 14px 18px;
        background: #f7f2ec;
        color: #8a7353;
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 20px;
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 15px 0;
        font-size: 12px;
      }
      input,
      select {
        padding: 12px;
        border: 1px solid #dedbdd;
        border-radius: 7px;
        background: white;
        min-width: 0;
      }
      .rules {
        display: grid;
        gap: 15px;
      }
      .rule {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 9px;
        gap: 15px;
      }
      .rule p {
        font-size: 12px;
        color: #888;
      }
      .rule input {
        accent-color: var(--red);
        width: 18px;
        height: 18px;
      }
      .twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .hidden {
        display: none !important;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 26px;
        width: min(480px, 94vw);
        color: var(--dark);
      }
      dialog::backdrop {
        background: #24202977;
        backdrop-filter: blur(3px);
      }
      .dialoghead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: #29282b;
        color: white;
        padding: 14px 24px;
        border-radius: 10px;
        z-index: 20;
        font-size: 13px;
      }
      .phoneModal {
        width: 440px;
        max-width: 98vw;
        background: #f2f1f2;
        padding: 18px;
      }
      .phoneModal iframe {
        display: block;
        width: 100%;
        height: 70vh;
        border: 7px solid #29282b;
        border-radius: 28px;
        background: white;
      }
      .forecastbars {
        display: flex;
        align-items: end;
        gap: 12px;
        height: 220px;
        padding-top: 20px;
      }
      .fbar {
        flex: 1;
        background: #b72b36bb;
        border-radius: 5px 5px 0 0;
        position: relative;
      }
      .fbar span {
        position: absolute;
        bottom: -24px;
        font-size: 11px;
        left: 50%;
        transform: translateX(-50%);
      }
      .fbar b {
        position: absolute;
        top: -22px;
        width: 100%;
        text-align: center;
        font-size: 11px;
      }
      .importzone {
        padding: 40px;
        text-align: center;
        border: 1px dashed #cbbbc0;
        border-radius: 10px;
        background: #fcfafb;
        margin: 18px 0;
      }
      .empty {
        padding: 35px;
        text-align: center;
        color: #888;
      }
      @media (min-width: 1600px) {
        main {
          margin-right: auto;
        }
      }
      @media (max-width: 1100px) {
        main {
          padding: 0 24px 24px;
        }
        .stats {
          gap: 10px;
        }
        .stat {
          padding: 17px;
        }
        .value {
          font-size: 24px;
        }
        .grid {
          grid-template-columns: 1.5fr 1fr;
        }
        aside {
          width: 190px;
          padding: 28px 15px;
        }
        main {
          margin-left: 190px;
        }
      }
      @media (max-width: 760px) {
        aside {
          position: fixed;
          inset: auto 0 0;
          width: auto;
          height: 70px;
          padding: 7px 8px;
          z-index: 5;
          border-top: 1px solid var(--line);
        }
        aside .brand,
        aside .subbrand,
        .sidebottom {
          display: none;
        }
        nav {
          display: flex;
          justify-content: space-around;
          gap: 0;
        }
        nav button {
          display: flex;
          flex-direction: column;
          gap: 5px;
          font-size: 10px;
          padding: 6px 10px;
        }
        nav button svg {
          width: 20px;
          height: 20px;
        }
        main {
          margin: 0;
          padding: 0 18px 90px;
        }
        header {
          height: 68px;
          margin-bottom: 23px;
        }
        .headerActions {
          gap: 7px;
        }
        .headerActions .avatar {
          display: none;
        }
        .crumb {
          font-size: 11px;
        }
        .titlebar {
          align-items: flex-start;
          flex-direction: column;
          gap: 16px;
        }
        h1 {
          font-size: 25px;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
          gap: 11px;
        }
        .stat {
          padding: 16px;
        }
        .value {
          margin: 15px 0 8px;
          font-size: 25px;
        }
        .trend span {
          display: block;
          margin: 4px 0 0;
        }
        .grid,
        .twocol {
          grid-template-columns: 1fr;
          gap: 17px;
        }
        .panel {
          padding: 18px;
        }
        .chart {
          height: 190px;
        }
        .phoneButton {
          font-size: 0;
          padding: 8px;
        }
        .phoneButton svg {
          width: 18px;
        }
        .headerActions button {
          padding: 8px;
        }
        footer {
          line-height: 1.6;
          gap: 20px;
        }
        .phoneModal iframe {
          height: 70vh;
        }
        .rule {
          padding: 13px;
        }
        .actions button {
          font-size: 12px;
        }
      }
    </style>
    <link rel="stylesheet" href="polish.css" />
    <link rel="icon" type="image/svg+xml" href="assets/m-logo.svg" />
    <link rel="apple-touch-icon" href="assets/m-logo.svg" />
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <img class="brandMark" src="assets/m-logo.svg" alt="M mağaza logosu" width="64" height="68" /><span
          class="brandWord"
          >dükkan<span style="color: var(--red)">.</span></span
        >
      </div>
      <div class="subbrand">İŞİNİZİN YANINDA</div>
      <nav id="nav"></nav>
      <div class="sidebottom">
        <div class="note" style="font-size: 11px; margin: 0">
          Daha az karmaşa.<br />Daha bilinçli kararlar.
        </div>
        <div class="shop">
          <span class="avatar">YM</span>
          <div><strong>Yılmaz Market</strong><span class="muted">İşletme paneli</span></div>
        </div>
      </div>
    </aside>
    <main>
      <header>
        <div class="headerIdentity">
          <img class="mobileMark" src="assets/m-logo.svg" alt="M mağaza logosu" width="36" height="39" />
          <div class="crumb">
            İşletmem <span style="margin: 0 10px; color: #ccc">/</span> <span id="crumb">Genel bakış</span>
          </div>
        </div>
        <div class="headerActions">
          <span class="demo">Örnek veri</span
          ><button class="tabletButton" onclick="openTablet()" title="Tablet görünümü">Tablet görünümü</button
          ><button class="phoneButton" onclick="openPhone()" title="Telefon görünümü">
            ▯ <span>Telefon görünümü</span></button
          ><button class="bell" onclick="navigate('Asistan')" aria-label="Bildirimleri aç">
            ♧<i class="dot"></i></button
          ><span class="avatar">EY</span>
        </div>
      </header>
      <div id="content"></div>
      <footer>
        <span>Dükkan · İşletmeniz için akıllı bir yardımcı</span
        ><span>2209-A araştırma projesi · Ön izleme</span>
      </footer>
    </main>
    <dialog id="modal">
      <div class="dialoghead">
        <h2 id="mtitle"></h2>
        <button onclick="this.closest('dialog').close()" aria-label="Kapat">×</button>
      </div>
      <div id="mbody"></div>
    </dialog>
    <dialog id="phone" class="phoneModal">
      <div class="dialoghead">
        <h2>Telefon görünümü</h2>
        <button onclick="document.getElementById('phone').close()">Kapat</button>
      </div>
      <iframe title="Uygulamanın telefon görünümü" id="phoneFrame"></iframe>
    </dialog>
    <div id="toast" class="toast hidden" role="status"></div>
    <script>
      const paths = {
        overview: "M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z",
        stock: "M3 7l9-4 9 4v11l-9 4-9-4z M3 7l9 4 9-4 M12 11v11",
        forecast: "M3 19h18 M5 15l5-5 4 3 6-9",
        agent:
          "M12 3v3 M7 6h10a4 4 0 014 4v7a3 3 0 01-3 3H6a3 3 0 01-3-3v-7a4 4 0 014-4 M8 11v3 M16 11v3 M9 17h6",
        report: "M5 3h10l4 4v14H5z M9 11h6 M9 15h6",
      };
      const ico = (k) =>
        `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k] || paths.report}"/></svg>`;
      const pages = [
        ["Genel bakış", "overview"],
        ["Ürünler & stok", "stock"],
        ["Tahminler", "forecast"],
        ["Asistan", "agent"],
        ["Raporlar", "report"],
      ];
      let page = "Genel bakış";
      let products = JSON.parse(localStorage.getItem("dukkan-products") || "null") || [
        { name: "Ekmek", category: "Temel gıda", stock: 18, min: 30, price: 15, icon: "◒", daily: 42 },
        { name: "Süt · 1 L", category: "Süt ürünleri", stock: 8, min: 15, price: 45, icon: "▯", daily: 12 },
        {
          name: "Yumurta · 30’lu",
          category: "Temel gıda",
          stock: 5,
          min: 10,
          price: 150,
          icon: "▦",
          daily: 4,
        },
        {
          name: "Ayçiçek yağı · 1 L",
          category: "Temel gıda",
          stock: 24,
          min: 10,
          price: 85,
          icon: "♧",
          daily: 3,
        },
        { name: "Çay · 500 g", category: "İçecek", stock: 32, min: 12, price: 130, icon: "▱", daily: 3 },
        { name: "Su · 1,5 L", category: "İçecek", stock: 65, min: 30, price: 15, icon: "♧", daily: 20 },
      ];
      let rules = JSON.parse(localStorage.getItem("dukkan-rules") || "[true,true,true]");
      const money = (n) =>
        new Intl.NumberFormat("tr-TR", {
          style: "currency",
          currency: "TRY",
          maximumFractionDigits: 0,
        }).format(n);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      function save() {
        localStorage.setItem("dukkan-products", JSON.stringify(products));
      }
      function toast(t) {
        let el = document.getElementById("toast");
        el.textContent = t;
        el.classList.remove("hidden");
        setTimeout(() => el.classList.add("hidden"), 3800);
      }
      function navigate(p) {
        page = p;
        render();
        window.scrollTo(0, 0);
      }
      function title(t, s, buttons = "") {
        return `<div class="titlebar"><div><h1>${t}</h1><p class="subtitle">${s}</p></div><div class="actions">${buttons}</div></div>`;
      }
      function table(list, edit = false) {
        return `<div class="tablewrap"><table><thead><tr><th>Ürün adı</th><th>Mevcut stok</th><th>Alt sınır</th><th>Durum</th><th>${edit ? "İşlem" : "Önerilen işlem"}</th></tr></thead><tbody>${list.map((p) => `<tr><td><span class="productIcon">${p.icon || "▦"}</span>${esc(p.name)}<div class="muted" style="margin-left:40px;font-size:10px">${esc(p.category)}</div></td><td>${p.stock} adet</td><td>${p.min} adet</td><td><span class="pill ${p.stock >= p.min ? "ok" : ""}">${p.stock >= p.min ? "Yeterli" : "Düşük stok"}</span></td><td><button class="link" onclick="editStock(${products.indexOf(p)})">${edit ? "Stok güncelle" : p.stock < p.min ? "Stok ekle →" : "Görüntüle →"}</button></td></tr>`).join("")}</tbody></table></div>`;
      }
      function chart() {
        let vals = [90, 105, 82, 135, 120, 170, 150, 180, 145, 210, 198, 238, 210, 250];
        let pts = vals.map((v, i) => `${48 + i * 39},${260 - v * 0.7}`).join(" ");

      function download(name, text, type = "text/csv;charset=utf-8") {

      function template() {

          "stok-sablonu.csv",

        );
      }
      function parseCSV(t) {
        t = t.replace(/^\uFEFF/, "");
        let sep = t.split(/\r?\n/)[0].includes(";") ? ";" : ",";
        let rows = [],
          r = [],
          s = "",
          quote = false;
        for (let i = 0; i < t.length; i++) {
          let c = t[i];
          if (c === '"') {
            if (quote && t[i + 1] === '"') {
              s += '"';
              i++;
            } else quote = !quote;
          } else if (c === sep && !quote) {
            r.push(s.trim());
            s = "";
          } else if (c === "\n" && !quote) {
            r.push(s.trim());
            if (r.some(Boolean)) rows.push(r);
            r = [];
            s = "";
          } else if (c !== "\r") s += c;
        }
        if (quote) throw Error("Kapanmamış çift tırnak var.");
        r.push(s.trim());
        if (r.some(Boolean)) rows.push(r);
        return rows;
      }
      let pending = [];
      async function checkCSV() {
        let el = document.getElementById("importResult"),
          f = document.getElementById("csvFile").files[0];
        pending = [];
        if (!f) {
          el.textContent = "Lütfen önce bir CSV dosyası seçin.";
          return;
        }
        try {
          if (f.size > 5e6) throw Error("Dosya boyutu en fazla 5 MB olabilir.");
          let rows = parseCSV(await f.text());
          let header = rows.shift() || [];
          let keys = ["urun", "kategori", "stok", "alt_sinir", "fiyat"];
          if (!keys.every((k) => header.includes(k)))
            throw Error("Başlıklar eksik. Lütfen örnek CSV şablonunu kullanın.");
          let idx = Object.fromEntries(keys.map((k) => [k, header.indexOf(k)]));
          let data = rows.map((r, i) => {
            let p = {
              name: r[idx.urun],
              category: r[idx.kategori],
              stock: Number(r[idx.stok]),
              min: Number(r[idx.alt_sinir]),
              price: Number((r[idx.fiyat] || "").replace(",", ".")),
              daily: 0,
              icon: "▦",
            };
            if (
              !p.name ||
              !p.category ||
              ![p.stock, p.min, p.price].every(Number.isFinite) ||
              p.stock < 0 ||
              p.min < 1 ||
              p.price < 0 ||
              !Number.isInteger(p.stock) ||
              !Number.isInteger(p.min) ||
              [idx.stok, idx.alt_sinir, idx.fiyat].some((n) => !r[n])
            )
              throw Error(`${i + 2}. satırda eksik veya geçersiz değer var.`);
            return p;
          });
          if (!data.length) throw Error("Dosyada ürün satırı yok.");
          pending = data;
          el.innerHTML = `<p>${data.length} ürün kontrol edildi. Var olan ürünler korunur; bu satırlar yeni ürün olarak eklenir.</p><button class="primary" onclick="importCSV()">${data.length} ürünü ekle</button>`;
        } catch (e) {
          el.textContent = "Dosya yüklenemedi: " + e.message;
        }
      }

      stocks = function () {

      function validBarcode(b) {
        return /^[0-9A-Za-z._-]{4,64}$/.test(b);
      }
      function findBarcode(b) {
        return products.findIndex((p) => p.barcode === b);
      }
      function scanBarcode(e) {
        e.preventDefault();
        let field = document.getElementById("barcodeScan"),
          b = field.value.trim(),
          result = document.getElementById("scanResult");
        if (!validBarcode(b)) {
          result.textContent = "4–64 karakterlik geçerli bir barkod okutun.";
          return;
        }
        let i = findBarcode(b);
        field.value = "";

        }
        let p = products[i];
        result.innerHTML = `<div class="note"><strong>${esc(p.name)}</strong> bulundu · Stok: ${p.stock} adet · Barkod: ${esc(b)}</div><form onsubmit="receiveStock(event,${i})" style="display:flex;gap:10px;align-items:end"><label class="field" style="flex:1;margin:0">Gelen miktar<input id="receiveQty" name="qty" type="number" min="1" max="999999" step="1" value="1" required></label><button class="primary">Stoğa ekle</button></form><p class="muted">Yalnızca stok girişi yapar; satış oluşturmaz. Tekrar okutmak onaylanmamış miktarı artırmaz.</p>`;
        document.getElementById("receiveQty").focus();
        document.getElementById("receiveQty").select();
      }
      function receiveStock(e, i) {
        e.preventDefault();
        let q = Number(new FormData(e.target).get("qty"));
        if (!Number.isSafeInteger(q) || q < 1 || q > 999999) return;
        if (!Number.isSafeInteger(products[i].stock + q)) {
          toast("Stok miktarı çok büyük.");
          return;
        }
        products[i].stock += q;
        save();
        let name = products[i].name;
        render();
        document.getElementById("scanResult").textContent =
          `${name}: ${q} adet eklendi. Yeni stok: ${products[i].stock} adet.`;
        document.getElementById("barcodeScan").focus();
      }
      addProduct = function (b = "") {
        baseAdd();
        let form = document.querySelector("#mbody form");
        form.insertAdjacentHTML(
          "afterbegin",
          `<p class="muted">${b ? "Barkod henüz kayıtlı değil. Ürünü bir kez tanımladıktan sonra sonraki okutmalarda otomatik bulunur." : "Barkodlu ürün, sonraki okutmalarda otomatik bulunur."}</p><label class="field">Barkod<input name="barcode" aria-label="Ürün barkodu" autocomplete="off" maxlength="64" value="${esc(b)}" placeholder="Okuyucuyla okutun veya boş bırakın"></label><p id="productError" role="alert" class="danger"></p>`,
        );
        form.querySelector('[name="barcode"]').addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            form.querySelector('[name="name"]').focus();
          }
        });
        form.querySelector(b ? '[name="name"]' : '[name="barcode"]').focus();
      };
      submitProduct = function (e) {
        e.preventDefault();
        let b = String(new FormData(e.target).get("barcode") || "").trim();
        if (b && (!validBarcode(b) || findBarcode(b) >= 0)) {
          document.getElementById("productError").textContent =
            findBarcode(b) >= 0
              ? "Bu barkod zaten kayıtlı. Stok girişi alanından okutun."
              : "Barkod 4–64 karakter olmalı; harf, rakam, nokta, tire ve alt çizgi içerebilir.";
          return;
        }
        baseSubmit(e);
        products[products.length - 1].barcode = b;
        save();
        render();
        if (page === "Ürünler & stok") document.getElementById("barcodeScan").focus();
      };
      table = function (list, edit = false) {
        return baseTable(list, edit)
          .replace(
            /<div class="muted" style="margin-left:40px;font-size:10px">([^<]*)<\/div>/g,
            (match, cat) => match,
          )
          .replace(/<td><span class="productIcon">([\s\S]*?)<\/td>/g, (match) => {
            let p = list.find((p) => match.includes(esc(p.name) + "<div"));
            return p && p.barcode
              ? match.replace(
                  "</td>",
                  `<div class="muted" style="margin-left:40px;font-size:10px">${esc(p.barcode)}</div></td>`,
                )
              : match;
          });
      };
      const baseFilter = filterStock;
      filterStock = function (q) {
        let list = products.filter(
          (p) =>
            (p.name.toLocaleLowerCase("tr").includes(q.toLocaleLowerCase("tr")) ||
              (p.barcode || "").includes(q)) &&
            (document.getElementById("stockFilter").value !== "low" || p.stock < p.min),
        );
        document.getElementById("stockTable").innerHTML = list.length
          ? table(list, true)
          : '<div class="empty">Ürün bulunamadı.</div>';
      };
      const baseReports = reports;
      reports = function () {
        return baseReports()
          .replace(
            "Başlıklar: urun, kategori, stok, alt_sinir, fiyat",
            "Başlıklar: barkod, urun, kategori, stok, alt_sinir, fiyat",
          )
          .replace(
            "CSV dosyanızı seçin. Kontrolden sonra ürün listenize ekleyin.",
            "Barkodlu ürün listenizi topluca yükleyin. Mevcut barkodlar yinelenirse aktarım durur; stoklar otomatik değiştirilmez.",
          );
      };
      template = function () {
        download(
          "barkodlu-stok-sablonu.csv",
          "\ufeffbarkod;urun;kategori;stok;alt_sinir;fiyat\r\nDEMO001;Örnek ürün;Temel gıda;18;30;15",
        );
      };
      exportCSV = function () {
        download(
          "dukkan-barkodlu-stok.csv",
          "\ufeff" +
            [
              csvrow(["barkod", "urun", "kategori", "stok", "alt_sinir", "fiyat"]),
              ...products.map((p) => csvrow([p.barcode || "", p.name, p.category, p.stock, p.min, p.price])),
            ].join("\r\n"),
        );
      };
      const baseCheck = checkCSV;
      checkCSV = async function () {
        await baseCheck();
        if (!pending.length) return;
        try {
          let f = document.getElementById("csvFile").files[0],
            rows = parseCSV(await f.text()),
            headers = rows.shift(),
            index = headers.indexOf("barkod");
          if (index < 0) return;
          let seen = new Set(products.filter((p) => p.barcode).map((p) => p.barcode));
          pending.forEach((p, i) => {
            let b = (rows[i][index] || "").trim();
            if (b && (!validBarcode(b) || seen.has(b)))
              throw Error(`${i + 2}. satırda geçersiz veya daha önce kayıtlı barkod var: ${b}`);
            if (b) seen.add(b);
            p.barcode = b;
          });
        } catch (e) {
          pending = [];
          document.getElementById("importResult").textContent = "Aktarım durduruldu: " + e.message;
        }
      };
      const baseRender = render;
      render = function () {
        baseRender();
        if (page === "Ürünler & stok") {
          document.getElementById("search").placeholder = "Ürün adı veya barkod ara…";
          document.getElementById("search").setAttribute("aria-label", "Ürün adı veya barkod ara");
          document.getElementById("barcodeScan").focus();
        }
      };

      let criticalOnly = false;
      const cardsNavigate = navigate;
      navigate = function (p) {
        criticalOnly = false;
        cardsNavigate(p);
      };
      function openCritical() {
        criticalOnly = true;
        page = "Ürünler & stok";
        render();
        window.scrollTo(0, 0);
      }
      function openSales() {
        const rows = [
          ["Ekmek", 100, 1500],
          ["Süt · 1 L", 50, 2250],
          ["Yumurta · 30’lu", 30, 4500],
          ["Ayçiçek yağı · 1 L", 40, 3400],
          ["Çay · 500 g", 60, 7800],
          ["Diğer ürünler", 6, 13000],
        ];
        modal(
          "Bugünkü satış detayları",
          `<div class="note">Örnek satış verisi · Gerçek satış kaydı henüz bağlı değil. Stok listenizden bağımsız bir gösterimdir.</div><div class="tablewrap"><table><thead><tr><th>Ürün / ürün grubu</th><th>Satış adedi</th><th>Satış tutarı</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${money(r[2])}</td></tr>`).join("")}<tr><td>Toplam</td><td><strong>${rows.reduce((s, r) => s + r[1], 0)}</strong></td><td><strong>${money(rows.reduce((s, r) => s + r[2], 0))}</strong></td></tr></tbody></table></div>`,
        );
      }
      const cardsRender = render;
      render = function () {
        cardsRender();
        if (page === "Genel bakış") {
          let cards = document.querySelectorAll(".stats .stat");
          [
            [1, openSales, "Satış detaylarını göster"],
            [3, openCritical, "Kritik ürünleri göster"],
          ].forEach(([i, fn, label]) => {
            let card = cards[i];
            card.setAttribute("role", "button");
            card.setAttribute("tabindex", "0");
            card.setAttribute("aria-label", label);
            card.style.cursor = "pointer";
            card.onclick = fn;
            card.onkeydown = (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                fn();
              }
            };
            card.insertAdjacentHTML(
              "beforeend",
              '<div class="link" style="margin-top:12px">Detayları gör →</div>',
            );
          });
        }
        if (page === "Ürünler & stok" && criticalOnly) {
          document.getElementById("stockFilter").value = "low";
          filterStock(document.getElementById("search").value);
          document.querySelector("#content h1").textContent = "Kritik stoklar";
          if (!products.some((p) => p.stock < p.min))
            document.getElementById("stockTable").innerHTML =
              '<div class="empty">Alt sınırın altında ürün yok. Tüm stoklarınız yeterli.</div>';
        }
      };

      render();
    </script>
    <script src="sales.js"></script>
    <script src="polish.js"></script>
    <script src="register-core.js"></script>
    <script src="register.js"></script>
  </body>
</html>
